# PostgreSQL es externo (RNF-07): no hay servicio `db`.
# Fase 1 del dominio (CHG-020, T-119): en el VPS solo se levanta `caddy` (`docker compose up -d caddy`).
services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - ffmovil_net
    restart: unless-stopped
    init: true                  # recoge procesos zombi y reenvía señales (apagado limpio)
    stop_grace_period: 110s     # la app espera hasta 100 s las recargas en curso
    read_only: true             # el código no escribe en disco
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m         # igual a mem_limit: sin swap
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Único servicio con puertos publicados (RNF-18). Sin depends_on: puede levantarse solo.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Fase 1: página «Próximamente». En la fase 2 (T-120) CADDYFILE apunta a deploy/Caddyfile.app.
      - ${CADDYFILE:-./deploy/Caddyfile.proximamente}:/etc/caddy/Caddyfile:ro
      - ./deploy/proximamente:/srv/proximamente:ro
      - caddy_data:/data          # certificados y claves de Let's Encrypt
      - caddy_config:/config
    networks:
      - ffmovil_net
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  ffmovil_net:
    external: true
