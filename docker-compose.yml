# PostgreSQL es externo (RNF-07): no hay servicio `db`. Caddy queda diferido hasta tener dominio.
services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - ffmovil_net
    restart: unless-stopped
    init: true                  # recoge procesos zombi y reenvía señales (apagado limpio)
    stop_grace_period: 110s     # la app espera hasta 100 s las recargas en curso
    read_only: true             # el código no escribe en disco
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m         # igual a mem_limit: sin swap
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ffmovil_net:
    external: true
