[project]
name = "ffmovil"
version = "0.1.0"
description = "Plataforma de recargas Free Fire con cuentas prepago"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
