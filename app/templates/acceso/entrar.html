{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block cabecera %}{% endblock %}
{% from "parciales/iconos.html" import icono, copiar, vacio %}
{% block contenido %}
<article class="angosto">
  <img src="{{ estatico("logo.png") }}" alt="FFmovil" class="logo-entrar" width="112" height="112">
  <h1 class="titulo-entrar">Iniciar sesión</h1>
  <form hx-post="/login" hx-target="#mensaje" hx-disabled-elt="find button">
    <label>Usuario
      <input name="usuario" autocomplete="username" required autofocus>
    </label>
    <label>Contraseña
      <span class="campo-clave">
        <input name="clave" type="password" autocomplete="current-password" required>
        <button type="button" class="ver-clave" aria-label="Mostrar contraseña" title="Mostrar contraseña">{{ icono("ojo") }}{{ icono("ojo-tachado", "oculto") }}</button>
      </span>
    </label>
    <button type="submit">Entrar</button>
  </form>
</article>
<div id="mensaje" class="etiqueta-mensaje"></div>
{% endblock %}
