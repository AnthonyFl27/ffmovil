{% if alertas %}
<div class="overflow-auto">
<table class="tarjetas">
  <thead>
    <tr><th>Tipo</th><th>Mensaje</th><th>Creada</th><th></th></tr>
  </thead>
  <tbody>
  {% for a in alertas %}
    <tr>
      <td data-etiqueta="Tipo">{{ a.tipo }}</td>
      <td data-etiqueta="Mensaje">{{ a.mensaje }}</td>
      <td data-etiqueta="Creada">{{ a.creada_en | fecha }}</td>
      <td data-etiqueta="Acciones" class="accion"><button class="secondary outline" hx-post="/gestion/alertas/{{ a.id }}/atender" hx-target="#alertas" hx-disabled-elt="this">Marcar atendida</button></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p>No hay alertas activas.</p>
{% endif %}
