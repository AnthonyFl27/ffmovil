{% extends "base.html" %}
{% block titulo %}Auditoría{% endblock %}
{% block contenido %}
<h1>Auditoría</h1>
<article>
<form hx-post="/gestion/config" hx-target="#mensaje-config" hx-disabled-elt="find button">
  <label>Alerta de crédito bajo en VentasFF (USD)
    <input name="alerta_credito_min" inputmode="decimal" required value="{{ '%.2f' | format(config.alerta_credito_min) }}">
  </label>
  <div id="mensaje-config"></div>
  <button type="submit">Guardar</button>
</form>
</article>
<h2>Historial</h2>
{% set hay_filtros = filtros.accion or filtros.desde or filtros.hasta %}
<details class="filtros"{% if hay_filtros %} open{% endif %}>
<summary>Filtros</summary>
<form hx-get="/gestion/auditoria" hx-target="#registros" hx-push-url="true">
  <input type="hidden" name="tz" value="{{ filtros.tz or '' }}">
  <div class="grid">
    <label>Acción <input name="accion" value="{{ filtros.accion or '' }}"></label>
    <label>Desde <input type="date" name="desde" value="{{ filtros.desde or '' }}"></label>
    <label>Hasta <input type="date" name="hasta" value="{{ filtros.hasta or '' }}"></label>
  </div>
  <div class="acciones">
    <button type="submit">Filtrar</button>
    <a role="button" class="secondary outline" href="/gestion/auditoria">Limpiar</a>
  </div>
</form>
</details>
<div id="registros">
{% include "admin/_tabla_auditoria.html" %}
</div>
{% endblock %}
